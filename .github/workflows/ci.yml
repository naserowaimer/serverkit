name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # weekly: catch renamed/removed Homebrew and Flathub packages

permissions:
  contents: read

jobs:
  check:
    name: lint + catalog
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck jq
      - run: tests/check.sh --online
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # winget lookups use the GitHub API

  unit:
    name: unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 --branch v1.14.0 https://github.com/bats-core/bats-core.git /tmp/bats
      - run: /tmp/bats/bin/bats tests/unit

  distros:
    name: ${{ matrix.image }}
    needs: check
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:22.04
          - ubuntu:24.04
          - debian:12
          - debian:13
          - fedora:latest
          - rockylinux/rockylinux:9
          - almalinux:10
          - amazonlinux:2023
          - archlinux:latest
          - manjarolinux/base:latest
          - opensuse/leap:15.6
          - opensuse/tumbleweed:latest
    steps:
      - uses: actions/checkout@v4
      - run: PHASE=full tests/distro/run.sh "${{ matrix.image }}"
      - if: failure()
        run: cat /tmp/tmp.*/*.log

  # A root-only machine (no sudo, no other account): Homebrew runs as the
  # hidden linuxbrew account and every tool is set up for root.
  as-root:
    name: as root (${{ matrix.image }})
    needs: check
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:24.04, debian:13, fedora:latest, archlinux:latest]
    steps:
      - uses: actions/checkout@v4
      - run: PHASE=root tests/distro/run.sh "${{ matrix.image }}"
      - if: failure()
        run: cat /tmp/tmp.*/*.log

  # A real, disposable VM with systemd: every system item runs for real,
  # including firewall, sshd, fail2ban and the timers — then again to prove
  # the second run changes nothing.
  vm-ubuntu:
    name: real run on an Ubuntu VM
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: install (apps profile, minus items that need a real cloud account)
        run: ./serverkit apply --profile apps --skip tailscale,cloudflared --yes --plain
      - name: second run changes nothing
        run: |
          ./serverkit apply --profile apps --skip tailscale,cloudflared --yes --plain --verbose | tee second.log
          ! grep -E '(created|updated): ' second.log
      - name: services are healthy and SSH still works
        run: |
          sudo sshd -t
          systemctl is-active fail2ban nginx docker
          sudo ufw status | grep -q 'Status: active'
          sudo ufw status | grep -q '22/tcp'
          ./serverkit health
          ./serverkit status

  macos:
    name: real run on macOS (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        # the macOS versions Homebrew supports (older ones build from source)
        os: [macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: ./serverkit doctor
      - run: ./serverkit apply --profile desktop --dry-run --yes
      - run: ./serverkit install ripgrep fd jq zsh-setup tmux-config git-defaults gnu-tools rectangle --yes --plain
      - name: second run changes nothing
        run: |
          ./serverkit install ripgrep fd jq zsh-setup tmux-config git-defaults gnu-tools rectangle --yes --plain --verbose | tee second.log
          ! grep -E '(created|updated): ' second.log

  windows-lint:
    name: Windows lint + unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer + Pester (PowerShell 7)
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          Install-Module Pester -MinimumVersion 5.5 -Scope CurrentUser -Force -SkipPublisherCheck
          $s = 'tests/win/PSScriptAnalyzerSettings.psd1'
          $r = @(Get-ChildItem win -Recurse -Filter *.ps1 | ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Settings $s })
          $r += Invoke-ScriptAnalyzer -Path install.ps1 -Settings $s
          # starship/zoxide/mise hook into PowerShell through Invoke-Expression by design
          $r += Invoke-ScriptAnalyzer -Path files/win/profile.ps1 -Settings $s -ExcludeRule PSAvoidUsingInvokeExpression
          $r = @($r | Where-Object { $_ })
          if ($r.Count) { $r | Format-Table ScriptName, Line, RuleName, Message -AutoSize -Wrap | Out-String -Width 200 | Write-Host; exit 1 }
          $c = New-PesterConfiguration; $c.Run.Path = 'tests/win'; $c.Run.Exit = $true; $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c
      - name: Pester (Windows PowerShell 5.1, built into every Windows)
        shell: powershell
        run: |
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force | Out-Null
          Install-Module Pester -MinimumVersion 5.5 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -MinimumVersion 5.5
          $c = New-PesterConfiguration; $c.Run.Path = 'tests/win'; $c.Run.Exit = $true; $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c

  windows:
    name: real run on Windows (${{ matrix.os }})
    needs: [check, windows-lint]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      # CI runners only have an elevated account; on a real PC serverkit runs
      # as you and asks for administrator rights once, via UAC.
      SERVERKIT_SCOOP_AS_ADMIN: "1"
      ITEMS: essentials ripgrep jq fzf bat fd eza gh delta lazygit btop zoxide neovim gnu-tools pgcli starship pwsh-setup nerd-font windows-terminal windows-tweaks developer-mode long-paths git-defaults
    steps:
      - uses: actions/checkout@v4
      - name: doctor
        shell: cmd
        run: serverkit.cmd doctor
      - name: dry run of the desktop profile
        shell: cmd
        run: serverkit.cmd apply --profile desktop --dry-run --yes
      - name: Windows PowerShell 5.1 runs it too
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File win\serverkit.ps1 install ripgrep pwsh-setup windows-terminal --dry-run --yes; exit $LASTEXITCODE
      - name: real install
        shell: cmd
        run: serverkit.cmd install %ITEMS% --yes --plain
      - name: second run changes nothing
        shell: pwsh
        run: |
          & .\serverkit.cmd install $env:ITEMS.Split(' ') --yes --plain --verbose | Tee-Object second.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Select-String -Path second.log -Pattern '(created|updated): ') { Write-Host 'second run changed files'; exit 1 }
      - name: results are in place
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path "$env:APPDATA\serverkit\profile.ps1")) { throw 'profile config missing' }
          $prof = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'PowerShell\profile.ps1'
          if (-not (Select-String -Path $prof -SimpleMatch '# >>> serverkit:serverkit >>>')) { throw 'profile block missing' }
          if ((Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem').LongPathsEnabled -ne 1) { throw 'long paths not enabled' }
          if ((Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced').HideFileExt -ne 0) { throw 'file extensions still hidden' }
          if (-not (Test-Path "$env:LOCALAPPDATA\Microsoft\Windows Terminal\Fragments\serverkit\serverkit.json")) { throw 'terminal fragment missing' }
          # the tools run, from a fresh PATH like a new terminal's
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          foreach ($t in 'rg', 'jq', 'fzf', 'bat', 'fd', 'eza', 'gh', 'delta', 'lazygit', 'zoxide', 'nvim', 'grep', 'sed', 'make', 'pgcli', 'starship') {
            $c = Get-Command $t -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $c) { throw "$t is not on PATH" }
            Write-Host "$t -> $($c.Source)"
          }
          & pgcli --version
          if ($LASTEXITCODE -ne 0) { throw 'pgcli does not run' }
          # the profile loads cleanly in both PowerShell editions
          pwsh -NoLogo -Command "`$Error.Clear(); . '$prof'; if (`$Error.Count) { `$Error; exit 1 }"
          powershell -NoLogo -Command "`$Error.Clear(); . '$prof'; if (`$Error.Count) { `$Error; exit 1 }"
      - name: a winget app
        shell: cmd
        run: serverkit.cmd install winget notepadpp --yes --plain
      - name: health and status
        shell: cmd
        run: serverkit.cmd health && serverkit.cmd status
