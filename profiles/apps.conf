# apps — a server running live web apps for several people. Sites are
# published through a Cloudflare wildcard tunnel to nginx, so no web port opens.
PROFILE_DESC="multi-user live apps server: hardened, resource caps, nginx + tunnel, backups"
ITEMS="essentials homebrew firewall ssh-hardening fail2ban auto-updates kernel-hardening user-limits
  docker lazydocker tailscale cloudflared nginx disk-health backups shared-users
  runtimes starship zsh-setup tmux-config ssh-autotmux git-defaults
  ripgrep fd bat fzf eza jq btop ncdu duf tldr delta lazygit"
SSH_MAX_AUTH_TRIES=3
FAIL2BAN_BANTIME=24h
FAIL2BAN_MAXRETRY=4
FAIL2BAN_ESCALATE=true
USER_MEMORY_MAX=40%
USER_TASKS_MAX=4096
DOCKER_LOG_MAX_SIZE=50m
DOCKER_LOG_MAX_FILE=5
TUNNEL_MODE=wildcard
SHARED_GROUP=deployers
SHARED_ROOT=/srv/apps
BACKUP_PATHS="/etc /home /srv /opt"
BACKUP_KEEP="--keep-daily 14 --keep-weekly 8 --keep-monthly 12"
