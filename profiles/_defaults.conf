# ==============================================================================
#  Every setting serverkit understands, with its default. NAME=value lines only.
#
#  Precedence (later wins):  this file < profiles/<profile>.conf
#     < ~/.config/serverkit/config.conf (saved by the wizard, or edited by you)
#     < --set NAME=value on the command line
#  `serverkit config` shows the values in force and where each came from.
# ==============================================================================

PROFILE_DESC=""
ITEMS=""                      # items the profile preselects (see: serverkit list)

# ---- SSH / security ----
SSH_PASSWORD_AUTH=keep        # keep | no  — 'no' only applies if you already have a key login
SSH_MAX_AUTH_TRIES=5
FIREWALL_ALLOW=""             # extra inbound rules, e.g. "80/tcp 443/tcp" (SSH is always allowed)
FAIL2BAN_BANTIME=1h
FAIL2BAN_FINDTIME=10m
FAIL2BAN_MAXRETRY=5
FAIL2BAN_ESCALATE=false       # repeat offenders get longer and longer bans (up to a week)
FAIL2BAN_IGNOREIP="127.0.0.1/8 ::1 100.64.0.0/10"
AUTO_REBOOT=false             # Debian/Ubuntu: reboot after updates that need it
AUTO_REBOOT_TIME=04:00
USER_MEMORY_MAX=""            # per login user, e.g. 40%   (the admin is exempt)
USER_TASKS_MAX=""             # e.g. 4096
USER_CPU_QUOTA=""             # e.g. 200% = two cores

# ---- containers ----
DOCKER_LOG_MAX_SIZE=10m
DOCKER_LOG_MAX_FILE=3
DOCKER_ADDRESS_POOL=""        # e.g. 172.20.0.0/16 to keep Docker off your LAN range
DOCKER_GROUP_ADD=true         # let the admin use docker without sudo (root-equivalent)

# ---- web & remote ----
DOMAIN=""
TUNNEL_MODE=single            # single: app.DOMAIN -> :3000 | wildcard: *.DOMAIN -> nginx :80
WEB_PUBLIC=false              # open ports 80/443 in the firewall
CODE_SERVER_PORT=8080

# ---- storage ----
ZFS_POOLS=""                  # empty = every imported pool
ZFS_SNAP_KEEP=48
BACKUP_PATHS="/etc /home /srv"
BACKUP_ONCALENDAR=daily
BACKUP_KEEP="--keep-daily 7 --keep-weekly 4 --keep-monthly 6"

# ---- users ----
ADMIN_USER=""                 # admin-user item: name of the sudo user to create
SHARED_GROUP=developers
SHARED_ROOT=/srv/projects

# ---- runtimes ----
MISE_TOOLS="node@lts python@3.13 go@latest"
