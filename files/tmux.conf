# managed-by:serverkit — sourced from ~/.tmux.conf; put your own settings there, after it.
# ════════════════════════════════════════════════════════════════════════
#  COPY MODE IS VIM NORMAL MODE.  prefix = Ctrl-b
#
#  ENTER   prefix [   prefix Escape   prefix /   or just scroll up
#  LEAVE   i a I A q  -> back to the prompt      Escape clears sel, then exits
#          scrolling back to the bottom exits by itself
#
#  MOVE    h j k l  w b e  0 ^ $  H M L  g G  { }  %  f F t T ; ,
#          C-u C-d half page   C-b C-f full page   [ ] prev/next prompt
#  SEARCH  / ? forward/back    n N repeat    * # word under cursor
#          s  fuzzy-search the whole scrollback (fzf popup)
#  SELECT  v char   V line   C-v block   o swap ends
#  YANK    y selection   Y line   C-y yank and stay
#          yanks reach your LOCAL clipboard over SSH via OSC 52
#
#  PANES   prefix | -  split      Alt+arrows or prefix h j k l  move
#          prefix H J K L resize  prefix z zoom   prefix x kill
#  OTHER   prefix f fuzzy scrollback   prefix u pick a URL
#          prefix r reload   prefix S sessions
# ════════════════════════════════════════════════════════════════════════

# ---------- base ----------
set -g mouse on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,*256col*:RGB"
set -g history-limit 200000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g focus-events on
set -g display-time 2000
set -g status-interval 5

# Copy to your LOCAL clipboard over SSH via OSC 52. Works in most modern
# terminals and in Termius — this is what makes yanking useful on mobile.
set -g set-clipboard on
set -g allow-passthrough on

# ---------- vi everywhere ----------
setw -g mode-keys vi
set  -g status-keys vi

# ---------- the [0/0] lockout fix ----------
# `copy-mode -e` exits automatically once you scroll back to the bottom, so an
# accidental wheel-scroll never leaves you stuck unable to type.
bind -n WheelUpPane   if-shell -F -t = "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
  "send -M" "copy-mode -e"
bind -n WheelDownPane if-shell -F -t = "#{pane_in_mode}" "send -M" "send -M"

# Any of these leaves copy mode instantly and returns you to the prompt.
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi q      send -X cancel
bind -T copy-mode-vi i      send -X cancel
bind -T copy-mode-vi a      send -X cancel
bind -T copy-mode-vi Enter  send -X cancel
bind -T copy-mode-vi C-c    send -X cancel

# ---------- copy mode = vim NORMAL mode ----------
# tmux 3.x already binds most vim motions in vi mode:
#   h j k l w W b B e 0 ^ $ H M L g G { } % f F t T ; ,
#   C-u C-d C-b C-f C-e C-y   n N   * #   / ?
# Below only adds what's missing and changes what should behave differently.

bind Escape copy-mode
bind [      copy-mode
bind / copy-mode \; send -X search-backward ""
bind ? copy-mode \; send -X search-forward ""

# --- leaving copy mode: i/a/I/A drop you straight back to the prompt ---
bind -T copy-mode-vi i     send -X cancel
bind -T copy-mode-vi a     send -X cancel
bind -T copy-mode-vi I     send -X cancel
bind -T copy-mode-vi A     send -X cancel
bind -T copy-mode-vi q     send -X cancel
bind -T copy-mode-vi C-c   send -X cancel
# Escape behaves like vim: first clears a selection, then exits
bind -T copy-mode-vi Escape if-shell -F "#{selection_present}" \
  "send -X clear-selection" "send -X cancel"
# Enter copies if you're selecting, otherwise just leaves
bind -T copy-mode-vi Enter  if-shell -F "#{selection_present}" \
  "send -X copy-selection-and-cancel" "send -X cancel"

# --- selection + yank ---
bind -T copy-mode-vi v     send -X begin-selection
bind -T copy-mode-vi V     send -X select-line
bind -T copy-mode-vi C-v   send -X begin-selection \; send -X rectangle-toggle
bind -T copy-mode-vi o     send -X other-end
bind -T copy-mode-vi y     send -X copy-selection-and-cancel
bind -T copy-mode-vi Y     send -X copy-line-and-cancel
# stay in copy mode after yanking (vim-ish: yank doesn't leave normal mode)
bind -T copy-mode-vi C-y   send -X copy-selection

# --- jump between shell prompts, like vim's { } for paragraphs ---
bind -T copy-mode-vi '[' send -X previous-prompt
bind -T copy-mode-vi ']' send -X next-prompt

# --- fuzzy search the scrollback from inside copy mode ---
bind -T copy-mode-vi s run-shell -b \
  "tmux display-popup -E -w 90% -h 80% \
   \"tmux capture-pane -p -S -200000 -t '#{pane_id}' | \
     fzf --tac --no-sort --exact --reverse --prompt='search> ' | \
     tmux load-buffer - 2>/dev/null && tmux display 'yanked'\""

# --- mouse: drag selects and copies, double/triple click select word/line ---
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-selection
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; send -X copy-selection

# --- highlight styles ---
set -g mode-style "bg=colour208,fg=colour234"
set -g copy-mode-match-style "bg=colour58,fg=colour231"
set -g copy-mode-current-match-style "bg=colour208,fg=colour234,bold"

# ---------- fuzzy search the scrollback (needs fzf) ----------
bind f display-popup -E -w 90% -h 80% \
  "tmux capture-pane -p -S -200000 -t '#{pane_id}' | \
   fzf --tac --no-sort --exact --reverse --prompt='scrollback> ' | \
   tmux load-buffer - 2>/dev/null && tmux display 'copied to buffer'"

# grab a URL off the screen
bind u display-popup -E -w 80% -h 60% \
  "tmux capture-pane -p -S -10000 -t '#{pane_id}' | \
   grep -oE 'https?://[^ \"'\\'']+' | sort -u | \
   fzf --tac --reverse --prompt='url> ' | tmux load-buffer - 2>/dev/null"

# ---------- panes & windows ----------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
bind x kill-pane
bind X kill-window
bind z resize-pane -Z
bind S choose-session

# ---------- status bar ----------
set -g status-position bottom
set -g status-style "bg=colour234,fg=colour248"
set -g status-left-length 30
set -g status-right-length 60
# COPY badge makes it obvious why typing isn't reaching the shell
set -g status-left "#[bg=colour208,fg=colour234,bold] #S #[default]#{?pane_in_mode,#[bg=colour167#,fg=colour234#,bold] COPY #[default],} "
set -g status-right "#[fg=colour244]#(uptime | sed 's/.*load average: //' | cut -d, -f1) #[fg=colour240]| #[fg=colour248]%H:%M "
setw -g window-status-current-style "fg=colour208,bold"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
set -g pane-active-border-style "fg=colour208"
set -g pane-border-style "fg=colour238"
set -g message-style "bg=colour208,fg=colour234"
